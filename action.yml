name: pixi-sbom
# The Marketplace caps the description at 125 characters.
description: >-
  CycloneDX or SPDX SBOM from pixi.lock, with licenses, PyPI identities and a license policy gate; no pixi setup needed
author: Kevin Mills
branding:
  icon: shield
  color: blue

inputs:
  version:
    description: >-
      pixi-sbom version to run (e.g. 0.5.1). Defaults to the version the action was referenced
      at (`uses: millsks/pixi-sbom@v0.5.1`), or the latest release when referenced by branch.
    required: false
    default: ""
  lockfile:
    description: Path to pixi.lock. Defaults to searching upward from the working directory.
    required: false
    default: ""
  config:
    description: >-
      Configuration file to read before the inputs (`[tool.pixi-sbom]` in pyproject.toml or
      pixi-sbom.toml next to the lockfile are read by default; `none` ignores them).
    required: false
    default: ""
  format:
    description: "`cyclonedx` or `spdx`."
    required: false
    default: cyclonedx
  spec-version:
    description: "CycloneDX specification version, `1.6` or `1.7`."
    required: false
    default: ""
  environment:
    description: Lock environment to describe.
    required: false
    default: ""
  all-environments:
    description: Write one document per environment.
    required: false
    default: "false"
  platform:
    description: Platform within the environment (e.g. linux-64). Defaults to the runner's.
    required: false
    default: ""
  all-platforms:
    description: Write one document per locked platform.
    required: false
    default: "false"
  output:
    description: >-
      Output file, or output directory in batch mode. Defaults to `sboms/` in the working
      directory so the artifact upload has one place to collect.
    required: false
    default: sboms
  fetch-licenses:
    description: Fetch licenses for every package (conda archives and wheels by HTTP range, PyPI index).
    required: false
    default: "false"
  license-texts:
    description: With fetch-licenses, embed the full license texts.
    required: false
    default: "false"
  embedded-sboms:
    description: Attach the components declared by SBOMs embedded in wheels (PEP 770).
    required: false
    default: "false"
  pypi-mapping:
    description: "`lock` (the default) or `prefix`: where PyPI identities for conda packages come from."
    required: false
    default: ""
  primary-purl:
    description: "`conda` (the default) or `pypi`: which purl is a conda package's primary identity."
    required: false
    default: ""
  allow-license:
    description: Allowed SPDX licenses, whitespace separated. Violations exit with code 3.
    required: false
    default: ""
  deny-license:
    description: Denied SPDX licenses, whitespace separated. Violations exit with code 3.
    required: false
    default: ""
  require-license:
    description: Every package must declare an SPDX license.
    required: false
    default: "false"
  fail-on-policy:
    description: Fail the step when the license policy is violated (exit code 3).
    required: false
    default: "true"
  vulnerabilities:
    description: "`osv` to look up known vulnerabilities and record them in the document."
    required: false
    default: ""
  kev:
    description: With vulnerabilities, mark findings in CISA's Known Exploited Vulnerabilities catalog.
    required: false
    default: "false"
  fail-on-severity:
    description: "`low`, `medium`, `high` or `critical`: fail the step on open findings at or above it (exit code 4)."
    required: false
    default: ""
  fail-on-kev:
    description: With kev, fail the step on open known-exploited findings (exit code 4).
    required: false
    default: "false"
  ignore-vuln:
    description: >-
      Findings to accept, one per line, as `ID`, `ID:justification` or `ID:state:justification`
      (advisory id or CVE alias).
    required: false
    default: ""
  fail-on-vulnerabilities:
    description: Fail the step when the vulnerability gate trips (exit code 4).
    required: false
    default: "true"
  upload-sarif:
    description: >-
      With vulnerabilities, also write the findings as SARIF and upload them to GitHub code scanning
      (needs `security-events: write`).
    required: false
    default: "false"
  sarif-category:
    description: >-
      Code scanning category for the SARIF upload. Each document is its own run, so alerts appear
      under `pixi-sbom/<environment>` (or `<environment>/<platform>`) regardless of this value.
    required: false
    default: pixi-sbom
  extra-args:
    description: Additional command-line arguments, whitespace separated (e.g. `-v`).
    required: false
    default: ""
  attest:
    description: >-
      Sign the documents with a GitHub artifact attestation (needs `id-token: write` and
      `attestations: write`). With `attest-subject`, the SBOM is attached to that artifact as an
      SBOM attestation; without it, the documents themselves get a build provenance attestation.
    required: false
    default: "false"
  attest-subject:
    description: >-
      Path of the built artifact the SBOM describes, for an SBOM attestation
      (`actions/attest-sbom`). Single-document mode only.
    required: false
    default: ""
  upload-artifact:
    description: Upload the output as a workflow artifact.
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded artifact.
    required: false
    default: sboms

outputs:
  version:
    description: The pixi-sbom version that ran.
    value: ${{ steps.resolve.outputs.version }}
  output:
    description: The output file or directory.
    value: ${{ inputs.output }}
  policy-violated:
    description: "`true` when the license policy was violated."
    value: ${{ steps.run.outputs.policy-violated }}
  vulnerabilities-found:
    description: "`true` when the vulnerability gate tripped."
    value: ${{ steps.run.outputs.vulnerabilities-found }}
  sarif:
    description: Path of the SARIF file, when upload-sarif is set.
    value: ${{ steps.sarif.outputs.path }}
  document:
    description: Path of the document in single-document mode (empty in batch mode).
    value: ${{ steps.run.outputs.document }}
  attestation-url:
    description: URL of the attestation, when attest is set.
    value: ${{ steps.attest-sbom.outputs.attestation-url || steps.attest-provenance.outputs.attestation-url }}

runs:
  using: composite
  steps:
    - name: Resolve version and platform
      id: resolve
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        version="${INPUT_VERSION#v}"
        if [ -z "$version" ] && [[ "$ACTION_REF" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          version="${ACTION_REF#v}"
        fi
        if [ -z "$version" ]; then
          version=$(curl -sSfL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/millsks/pixi-sbom/releases/latest | \
            sed -n 's/.*"tag_name": *"v\{0,1\}\([^"]*\)".*/\1/p')
        fi
        [ -n "$version" ] || { echo "::error::cannot determine the pixi-sbom version to install"; exit 1; }
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) platform=linux-64; ext=tar.gz ;;
          Linux-ARM64) platform=linux-aarch64; ext=tar.gz ;;
          macOS-X64) platform=osx-64; ext=tar.gz ;;
          macOS-ARM64) platform=osx-arm64; ext=tar.gz ;;
          Windows-X64) platform=win-64; ext=zip ;;
          *) echo "::error::unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "platform=$platform" >> "$GITHUB_OUTPUT"
        echo "ext=$ext" >> "$GITHUB_OUTPUT"
        echo "Installing pixi-sbom $version for $platform"

    - name: Download and verify the release binary
      shell: bash
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
        PLATFORM: ${{ steps.resolve.outputs.platform }}
        EXT: ${{ steps.resolve.outputs.ext }}
      run: |
        set -euo pipefail
        name="pixi-sbom-v${VERSION}-${PLATFORM}"
        base="https://github.com/millsks/pixi-sbom/releases/download/v${VERSION}"
        dir="${RUNNER_TEMP}/pixi-sbom-install/${name}"
        # The action may run several times in one job; reuse an install of the same version.
        if ls "$dir/bin"/pixi-sbom* >/dev/null 2>&1; then
          echo "$dir/bin" >> "$GITHUB_PATH"
          "$dir/bin"/pixi-sbom* --version
          exit 0
        fi
        rm -rf "$dir" && mkdir -p "$dir" && cd "$dir"
        curl -sSfL -o "$name.$EXT" "$base/$name.$EXT"
        curl -sSfL -o "$name.$EXT.sha256" "$base/$name.$EXT.sha256"
        # The checksum file names the archive bare (GNU and BSD spellings); check it here.
        expected=$(cut -d' ' -f1 "$name.$EXT.sha256")
        if command -v sha256sum >/dev/null; then actual=$(sha256sum "$name.$EXT" | cut -d' ' -f1); else actual=$(shasum -a 256 "$name.$EXT" | cut -d' ' -f1); fi
        [ "$expected" = "$actual" ] || { echo "::error::checksum mismatch for $name.$EXT"; exit 1; }
        if [ "$EXT" = zip ]; then unzip -q -o "$name.zip"; else tar xzf "$name.tar.gz"; fi
        mkdir -p "$dir/bin"
        mv "$name"/pixi-sbom* "$dir/bin/"
        chmod +x "$dir/bin"/pixi-sbom* || true
        echo "$dir/bin" >> "$GITHUB_PATH"
        "$dir/bin"/pixi-sbom* --version

    - name: Generate the SBOM
      id: run
      shell: bash
      env:
        IN_LOCKFILE: ${{ inputs.lockfile }}
        IN_CONFIG: ${{ inputs.config }}
        IN_FORMAT: ${{ inputs.format }}
        IN_SPEC_VERSION: ${{ inputs.spec-version }}
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_ALL_ENVIRONMENTS: ${{ inputs.all-environments }}
        IN_PLATFORM: ${{ inputs.platform }}
        IN_ALL_PLATFORMS: ${{ inputs.all-platforms }}
        IN_OUTPUT: ${{ inputs.output }}
        IN_FETCH_LICENSES: ${{ inputs.fetch-licenses }}
        IN_LICENSE_TEXTS: ${{ inputs.license-texts }}
        IN_EMBEDDED_SBOMS: ${{ inputs.embedded-sboms }}
        IN_PYPI_MAPPING: ${{ inputs.pypi-mapping }}
        IN_PRIMARY_PURL: ${{ inputs.primary-purl }}
        IN_ALLOW_LICENSE: ${{ inputs.allow-license }}
        IN_DENY_LICENSE: ${{ inputs.deny-license }}
        IN_REQUIRE_LICENSE: ${{ inputs.require-license }}
        IN_FAIL_ON_POLICY: ${{ inputs.fail-on-policy }}
        IN_VULNERABILITIES: ${{ inputs.vulnerabilities }}
        IN_KEV: ${{ inputs.kev }}
        IN_FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        IN_FAIL_ON_KEV: ${{ inputs.fail-on-kev }}
        IN_IGNORE_VULN: ${{ inputs.ignore-vuln }}
        IN_FAIL_ON_VULNERABILITIES: ${{ inputs.fail-on-vulnerabilities }}
        IN_EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        set -uo pipefail
        # Flags shared by the document run and the SARIF report, kept for the next step.
        vuln=()
        [ -n "$IN_VULNERABILITIES" ] && vuln+=(--vulnerabilities "$IN_VULNERABILITIES")
        [ "$IN_KEV" = "true" ] && vuln+=(--kev)
        while IFS= read -r line; do
          [ -n "${line// }" ] && vuln+=(--ignore-vuln "$line")
        done <<< "$IN_IGNORE_VULN"
        # ${arr[@]+"${arr[@]}"} keeps an empty array from tripping `set -u` on older bash.
        printf '%s\n' ${vuln[@]+"${vuln[@]}"} > "$RUNNER_TEMP/pixi-sbom-vuln-args"
        args=()
        [ -n "$IN_LOCKFILE" ] && args+=(--lockfile "$IN_LOCKFILE")
        # `format` is always passed (the output file is named after it) and so wins over the
        # configuration file; the other inputs are passed only when set.
        case "$IN_CONFIG" in
          "") ;;
          none) args+=(--no-config) ;;
          *) args+=(--config "$IN_CONFIG") ;;
        esac
        args+=(--format "$IN_FORMAT")
        [ -n "$IN_SPEC_VERSION" ] && args+=(--spec-version "$IN_SPEC_VERSION")
        [ -n "$IN_ENVIRONMENT" ] && args+=(--environment "$IN_ENVIRONMENT")
        [ "$IN_ALL_ENVIRONMENTS" = "true" ] && args+=(--all-environments)
        [ -n "$IN_PLATFORM" ] && args+=(--platform "$IN_PLATFORM")
        [ "$IN_ALL_PLATFORMS" = "true" ] && args+=(--all-platforms)
        # A single document goes into the output directory under the default file name.
        document=""
        if [ "$IN_ALL_ENVIRONMENTS" = "true" ] || [ "$IN_ALL_PLATFORMS" = "true" ]; then
          args+=(--output "$IN_OUTPUT")
        else
          case "$IN_OUTPUT" in
            *.json) document="$IN_OUTPUT"; args+=(--output "$IN_OUTPUT") ;;
            -) args+=(--output "$IN_OUTPUT") ;;
            *) ext=cdx.json; [ "$IN_FORMAT" = spdx ] && ext=spdx.json; document="$IN_OUTPUT/sbom.$ext"; args+=(--output "$document") ;;
          esac
        fi
        echo "document=$document" >> "$GITHUB_OUTPUT"
        [ "$IN_FETCH_LICENSES" = "true" ] && args+=(--fetch-licenses)
        [ "$IN_LICENSE_TEXTS" = "true" ] && args+=(--license-texts)
        [ "$IN_EMBEDDED_SBOMS" = "true" ] && args+=(--embedded-sboms)
        [ -n "$IN_PYPI_MAPPING" ] && args+=(--pypi-mapping "$IN_PYPI_MAPPING")
        [ -n "$IN_PRIMARY_PURL" ] && args+=(--primary-purl "$IN_PRIMARY_PURL")
        for l in $IN_ALLOW_LICENSE; do args+=(--allow-license "$l"); done
        for l in $IN_DENY_LICENSE; do args+=(--deny-license "$l"); done
        [ "$IN_REQUIRE_LICENSE" = "true" ] && args+=(--require-license)
        args+=(${vuln[@]+"${vuln[@]}"})
        [ -n "$IN_FAIL_ON_SEVERITY" ] && args+=(--fail-on-severity "$IN_FAIL_ON_SEVERITY")
        [ "$IN_FAIL_ON_KEV" = "true" ] && args+=(--fail-on-kev)
        for a in $IN_EXTRA_ARGS; do args+=("$a"); done
        echo "pixi-sbom ${args[*]}"
        # GitHub runs bash steps with -e; capture the status instead of dying on exit code 3.
        code=0
        pixi-sbom "${args[@]}" || code=$?
        echo "policy-violated=false" >> "$GITHUB_OUTPUT"
        echo "vulnerabilities-found=false" >> "$GITHUB_OUTPUT"
        if [ "$code" -eq 3 ]; then
          echo "policy-violated=true" >> "$GITHUB_OUTPUT"
          if [ "$IN_FAIL_ON_POLICY" = "true" ]; then
            echo "::error::license policy violated (see the log above)"
            exit 3
          fi
          echo "::warning::license policy violated (see the log above)"
          exit 0
        fi
        if [ "$code" -eq 4 ]; then
          echo "vulnerabilities-found=true" >> "$GITHUB_OUTPUT"
          if [ "$IN_FAIL_ON_VULNERABILITIES" = "true" ]; then
            echo "::error::vulnerability gate failed (see the log above)"
            exit 4
          fi
          echo "::warning::vulnerability gate failed (see the log above)"
          exit 0
        fi
        exit "$code"

    - name: Write the findings as SARIF
      id: sarif
      if: ${{ inputs.upload-sarif == 'true' && inputs.vulnerabilities != '' && !cancelled() }}
      shell: bash
      env:
        IN_LOCKFILE: ${{ inputs.lockfile }}
        IN_CONFIG: ${{ inputs.config }}
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_ALL_ENVIRONMENTS: ${{ inputs.all-environments }}
        IN_PLATFORM: ${{ inputs.platform }}
        IN_ALL_PLATFORMS: ${{ inputs.all-platforms }}
        IN_PYPI_MAPPING: ${{ inputs.pypi-mapping }}
        IN_PRIMARY_PURL: ${{ inputs.primary-purl }}
      run: |
        set -uo pipefail
        args=(--report vulnerabilities --report-format sarif)
        [ -n "$IN_LOCKFILE" ] && args+=(--lockfile "$IN_LOCKFILE")
        case "$IN_CONFIG" in
          "") ;;
          none) args+=(--no-config) ;;
          *) args+=(--config "$IN_CONFIG") ;;
        esac
        [ -n "$IN_ENVIRONMENT" ] && args+=(--environment "$IN_ENVIRONMENT")
        [ "$IN_ALL_ENVIRONMENTS" = "true" ] && args+=(--all-environments)
        [ -n "$IN_PLATFORM" ] && args+=(--platform "$IN_PLATFORM")
        [ "$IN_ALL_PLATFORMS" = "true" ] && args+=(--all-platforms)
        [ -n "$IN_PYPI_MAPPING" ] && args+=(--pypi-mapping "$IN_PYPI_MAPPING")
        [ -n "$IN_PRIMARY_PURL" ] && args+=(--primary-purl "$IN_PRIMARY_PURL")
        while IFS= read -r line; do [ -n "$line" ] && args+=("$line"); done < "$RUNNER_TEMP/pixi-sbom-vuln-args"
        path="$RUNNER_TEMP/pixi-sbom-vulnerabilities.sarif"
        echo "pixi-sbom ${args[*]} > $path"
        # Everything is cached from the run above, so this is quick and needs no gate flags.
        pixi-sbom "${args[@]}" > "$path"
        echo "path=$path" >> "$GITHUB_OUTPUT"

    - name: Upload the SARIF to code scanning
      if: ${{ inputs.upload-sarif == 'true' && inputs.vulnerabilities != '' && !cancelled() }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.sarif.outputs.path }}
        category: ${{ inputs.sarif-category }}

    - name: Check the attestation inputs
      if: ${{ inputs.attest == 'true' && inputs.attest-subject != '' && steps.run.outputs.document == '' && !cancelled() }}
      shell: bash
      run: |
        echo "::error::attest-subject needs a single document; drop all-environments / all-platforms or the subject"
        exit 1

    - name: Attest the SBOM for the built artifact
      id: attest-sbom
      if: ${{ inputs.attest == 'true' && inputs.attest-subject != '' && steps.run.outputs.document != '' && !cancelled() }}
      uses: actions/attest-sbom@v4
      with:
        subject-path: ${{ inputs.attest-subject }}
        sbom-path: ${{ steps.run.outputs.document }}

    - name: Attest the provenance of the documents
      id: attest-provenance
      if: ${{ inputs.attest == 'true' && inputs.attest-subject == '' && inputs.output != '-' && !cancelled() }}
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: ${{ steps.run.outputs.document != '' && steps.run.outputs.document || format('{0}/*.json', inputs.output) }}

    - name: Upload the SBOM artifact
      if: ${{ inputs.upload-artifact == 'true' && inputs.output != '-' && !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output }}
        if-no-files-found: error
