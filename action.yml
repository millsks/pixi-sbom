name: pixi-sbom (deprecated)
# The Marketplace caps the description at 125 characters.
description: >-
  Moved to aesir-oss/pixi-sbom-action. This action forwards to it and warns; switch to aesir-oss/pixi-sbom-action@v1
author: Kevin Mills
branding:
  icon: shield
  color: blue

# Deprecated: pixi-sbom's action is aesir-oss/pixi-sbom-action. Every input and output is passed through
# unchanged, so `uses: millsks/pixi-sbom@v1` keeps working, and each run says where to move.
inputs:
  version:
    description: 'pixi-sbom version to run (e.g. 1.0.0). Defaults to the version the action was referenced at: `@v1.12.0`
      runs 1.12.0, `@v1` the newest 1.x.y release, a branch the latest release.'
    required: false
    default: ''
  lockfile:
    description: 'Path to the lockfile to describe: any kind pixi-sbom reads (`pixi.lock`, `uv.lock`, `pylock.toml`,
      `poetry.lock`, `pdm.lock`, `conda-lock.yml`, an explicit spec file). The action downloads its own binary, so pixi
      is not needed on the runner. Defaults to searching upward from the working directory.'
    required: false
    default: ''
  scan:
    description: 'Describe every project under this directory: one document per directory with a lockfile of any supported
      kind, written under `output` at the same relative path. Cannot be combined with `lockfile`, `prefix` or `from-sbom`.'
    required: false
    default: ''
  prefix:
    description: 'Describe an installed environment instead of a lockfile: a conda or pixi environment, a venv, or a
      Python installation (the directory holding `pyvenv.cfg`, `conda-meta/` or `lib/`). Cannot be combined with `lockfile`,
      `scan` or `from-sbom`.'
    required: false
    default: ''
  from-sbom:
    description: Read an existing CycloneDX or SPDX document instead of a lockfile, and write it again with everything
      else the action does (licenses, vulnerabilities, a policy). Cannot be combined with `lockfile`, `scan` or `prefix`.
    required: false
    default: ''
  config:
    description: Configuration file to read before the inputs (`[tool.pixi-sbom]` in pyproject.toml or pixi-sbom.toml
      next to the lockfile are read by default; `none` ignores them).
    required: false
    default: ''
  format:
    description: '`cyclonedx`, `spdx`, or `github` (a dependency submission snapshot).'
    required: false
    default: cyclonedx
  spec-version:
    description: CycloneDX specification version, `1.6` or `1.7`.
    required: false
    default: ''
  environment:
    description: Lock environment to describe.
    required: false
    default: ''
  all-environments:
    description: Write one document per environment.
    required: false
    default: 'false'
  platform:
    description: Platform within the environment (e.g. linux-64). Defaults to the runner's.
    required: false
    default: ''
  all-platforms:
    description: Write one document per locked platform.
    required: false
    default: 'false'
  output:
    description: Output file, or output directory in batch mode. Defaults to `sboms/` in the working directory so the
      artifact upload has one place to collect.
    required: false
    default: sboms
  fetch-licenses:
    description: Fetch licenses for every package (conda archives and wheels by HTTP range, PyPI index).
    required: false
    default: 'false'
  license-texts:
    description: With fetch-licenses, embed the full license texts.
    required: false
    default: 'false'
  embedded-sboms:
    description: Attach the components declared by SBOMs embedded in wheels (PEP 770).
    required: false
    default: 'false'
  pypi-mapping:
    description: '`lock` (the default) or `prefix`: where PyPI identities for conda packages come from.'
    required: false
    default: ''
  primary-purl:
    description: '`conda` (the default) or `pypi`: which purl is a conda package''s primary identity.'
    required: false
    default: ''
  allow-license:
    description: Allowed SPDX licenses, whitespace separated. Violations exit with code 3.
    required: false
    default: ''
  deny-license:
    description: Denied SPDX licenses, whitespace separated. Violations exit with code 3.
    required: false
    default: ''
  require-license:
    description: Every package must declare an SPDX license.
    required: false
    default: 'false'
  fail-on-policy:
    description: Fail the step when the license policy is violated (exit code 3).
    required: false
    default: 'true'
  ignore-license:
    description: Packages the license policy does not apply to, one per line, as `PACKAGE` or `PACKAGE:justification`
      (a name or a shell-style pattern).
    required: false
    default: ''
  scorecard:
    description: With `fetch-licenses`, ask the OpenSSF Scorecard service how each package's repository is maintained
      and record the score in the document.
    required: false
    default: 'false'
  scorecard-min:
    description: The score a package or one of its checks has to reach to be left alone (default 5).
    required: false
    default: ''
  fail-on-scorecard:
    description: Fail the step (exit code 9) when a scored package is below this score.
    required: false
    default: ''
  fail-on-yanked:
    description: With fetch-licenses, fail the step when any package is a yanked release (exit code 7).
    required: false
    default: 'false'
  vulnerabilities:
    description: '`osv` to look up known vulnerabilities and record them in the document.'
    required: false
    default: ''
  kev:
    description: With vulnerabilities, mark findings in CISA's Known Exploited Vulnerabilities catalog.
    required: false
    default: 'false'
  fail-on-severity:
    description: '`low`, `medium`, `high` or `critical`: fail the step on open findings at or above it (exit code 4).'
    required: false
    default: ''
  fail-on-kev:
    description: With kev, fail the step on open known-exploited findings (exit code 4).
    required: false
    default: 'false'
  ignore-vuln:
    description: Findings to accept, one per line, as `ID`, `ID:justification` or `ID:state:justification` (advisory
      id or CVE alias).
    required: false
    default: ''
  fail-on-vulnerabilities:
    description: Fail the step when the vulnerability gate trips (exit code 4).
    required: false
    default: 'true'
  vex:
    description: 'Also write a standalone CycloneDX VEX to this path: every finding with its analysis, linked back to
      the SBOM by BOM-Link. Needs `vulnerabilities`.'
    required: false
    default: ''
  vex-open:
    description: The analysis state the VEX gives findings nobody assessed - `in-triage` or `exploitable`.
    required: false
    default: ''
  upload-sarif:
    description: 'With vulnerabilities, also write the findings as SARIF and upload them to GitHub code scanning (needs
      `security-events: write`).'
    required: false
    default: 'false'
  sarif-category:
    description: Code scanning category for the SARIF upload. Each document is its own run, so alerts appear under `pixi-sbom/<environment>`
      (or `<environment>/<platform>`) regardless of this value.
    required: false
    default: pixi-sbom
  dependency-submission:
    description: 'Also write a GitHub dependency submission snapshot for each document and submit it to the repository''s
      dependency graph, where Dependabot alerts come from (needs `contents: write`). Conda packages with a PyPI identity
      are submitted by it.'
    required: false
    default: 'false'
  diff-against:
    description: 'Also compare the environment with a previous document at this path (CycloneDX, SPDX 2.3 or SPDX 3.0
      JSON) and write the comparison to the job summary. The file has to be there already: the action fetches nothing
      itself.'
    required: false
    default: ''
  fail-on-diff:
    description: 'With diff-against, fail the step (exit code 6) when the comparison is not empty. Either `true` for
      any change, or the sections to gate on, whitespace separated: `added`, `removed`, `version`, `license`.'
    required: false
    default: ''
  extra-args:
    description: Additional command-line arguments, whitespace separated (e.g. `-v`).
    required: false
    default: ''
  attest:
    description: 'Sign the documents with a GitHub artifact attestation (needs `id-token: write` and `attestations:
      write`). With `attest-subject`, the SBOM is attached to that artifact as an SBOM attestation; without it, the
      documents themselves get a build provenance attestation.'
    required: false
    default: 'false'
  attest-subject:
    description: Path of the built artifact the SBOM describes, for an SBOM attestation (`actions/attest-sbom`). Single-document
      mode only.
    required: false
    default: ''
  upload-artifact:
    description: Upload the output as a workflow artifact.
    required: false
    default: 'true'
  artifact-name:
    description: Name of the uploaded artifact.
    required: false
    default: sboms

outputs:
  version:
    description: The pixi-sbom version that ran.
    value: ${{ steps.forward.outputs.version }}
  output:
    description: The output file or directory.
    value: ${{ steps.forward.outputs.output }}
  policy-violated:
    description: '`true` when the license policy was violated.'
    value: ${{ steps.forward.outputs.policy-violated }}
  vulnerabilities-found:
    description: '`true` when the vulnerability gate tripped.'
    value: ${{ steps.forward.outputs.vulnerabilities-found }}
  sarif:
    description: Path of the SARIF file, when upload-sarif is set.
    value: ${{ steps.forward.outputs.sarif }}
  document:
    description: Path of the document in single-document mode (empty in batch mode).
    value: ${{ steps.forward.outputs.document }}
  diff-changed:
    description: Whether the comparison with diff-against found any change (empty when not used).
    value: ${{ steps.forward.outputs.diff-changed }}
  attestation-url:
    description: URL of the attestation, when attest is set.
    value: ${{ steps.forward.outputs.attestation-url }}

runs:
  using: composite
  steps:
    - name: Warn that this action has moved
      shell: bash
      run: >-
        echo "::warning title=pixi-sbom has moved::millsks/pixi-sbom is deprecated. Replace
        uses: millsks/pixi-sbom@v1 with uses: aesir-oss/pixi-sbom-action@v1; the inputs and outputs are the same."
    - name: pixi-sbom
      id: forward
      uses: aesir-oss/pixi-sbom-action@v1
      with:
        version: ${{ inputs.version }}
        lockfile: ${{ inputs.lockfile }}
        scan: ${{ inputs.scan }}
        prefix: ${{ inputs.prefix }}
        from-sbom: ${{ inputs.from-sbom }}
        config: ${{ inputs.config }}
        format: ${{ inputs.format }}
        spec-version: ${{ inputs.spec-version }}
        environment: ${{ inputs.environment }}
        all-environments: ${{ inputs.all-environments }}
        platform: ${{ inputs.platform }}
        all-platforms: ${{ inputs.all-platforms }}
        output: ${{ inputs.output }}
        fetch-licenses: ${{ inputs.fetch-licenses }}
        license-texts: ${{ inputs.license-texts }}
        embedded-sboms: ${{ inputs.embedded-sboms }}
        pypi-mapping: ${{ inputs.pypi-mapping }}
        primary-purl: ${{ inputs.primary-purl }}
        allow-license: ${{ inputs.allow-license }}
        deny-license: ${{ inputs.deny-license }}
        require-license: ${{ inputs.require-license }}
        fail-on-policy: ${{ inputs.fail-on-policy }}
        ignore-license: ${{ inputs.ignore-license }}
        scorecard: ${{ inputs.scorecard }}
        scorecard-min: ${{ inputs.scorecard-min }}
        fail-on-scorecard: ${{ inputs.fail-on-scorecard }}
        fail-on-yanked: ${{ inputs.fail-on-yanked }}
        vulnerabilities: ${{ inputs.vulnerabilities }}
        kev: ${{ inputs.kev }}
        fail-on-severity: ${{ inputs.fail-on-severity }}
        fail-on-kev: ${{ inputs.fail-on-kev }}
        ignore-vuln: ${{ inputs.ignore-vuln }}
        fail-on-vulnerabilities: ${{ inputs.fail-on-vulnerabilities }}
        vex: ${{ inputs.vex }}
        vex-open: ${{ inputs.vex-open }}
        upload-sarif: ${{ inputs.upload-sarif }}
        sarif-category: ${{ inputs.sarif-category }}
        dependency-submission: ${{ inputs.dependency-submission }}
        diff-against: ${{ inputs.diff-against }}
        fail-on-diff: ${{ inputs.fail-on-diff }}
        extra-args: ${{ inputs.extra-args }}
        attest: ${{ inputs.attest }}
        attest-subject: ${{ inputs.attest-subject }}
        upload-artifact: ${{ inputs.upload-artifact }}
        artifact-name: ${{ inputs.artifact-name }}
