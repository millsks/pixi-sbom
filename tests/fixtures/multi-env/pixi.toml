# Companion manifest for a hand-composed lockfile with several environments; not itself lockable.
[workspace]
name = "multi-env"
version = "3.0.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
libzlib = "1.3.*"

[feature.alpha.dependencies]
zlib = "1.3.*"

[environments]
zeta = ["alpha"]
alpha = ["alpha"]
