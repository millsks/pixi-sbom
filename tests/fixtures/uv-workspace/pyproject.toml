[project]
name = "acme-platform"
version = "2.1.0"
description = "A uv workspace: the root project and two first-party members"
requires-python = ">=3.12"
dependencies = ["acme-cli", "requests>=2.32"]

[tool.uv.sources]
acme-cli = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
