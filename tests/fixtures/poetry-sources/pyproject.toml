[project]
name = "ml-inference"
version = "1.2.0"
description = "A Poetry project with a dependency from a second, non-PyPI index"
requires-python = ">=3.12,<3.13"
dependencies = ["torch", "requests>=2.32"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
torch = { version = "2.9.0", source = "pytorch-cpu" }

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"
