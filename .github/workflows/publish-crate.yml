name: Publish crate

# Publishes the crate for a release tag to crates.io from a clean checkout of that tag, so
# `cargo install pixi-sbom` builds it and `cargo binstall pixi-sbom` reads its binstall
# metadata. Called by the release workflow; dispatch it by hand to (re)publish a tag.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.2.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.2.0)"
        required: true
        type: string

jobs:
  crate:
    name: crates.io ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set; the crate was not published to crates.io"
            exit 0
          fi
          # A clean checkout of the tag: cargo refuses to publish a dirty tree.
          git status --porcelain
          pixi run cargo publish --locked
