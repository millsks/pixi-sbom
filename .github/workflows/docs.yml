name: Docs site

# Publishes the MkDocs site to GitHub Pages whenever a release is published, so the site
# always describes the released binary. Dispatch it by hand for a docs-only republish.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build the site from (default: the default branch)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A release event checks out its tag; a manual run takes the ref given, else the default branch.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: docs
          cache: true
      - name: Build strictly
        run: pixi run -e docs docs-build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
