name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
      - name: pre-commit
        run: pixi run pre-commit-run
      - name: cargo fmt / clippy / check
        run: |
          pixi run cargo fmt --check
          pixi run lint
          pixi run check
      - name: actionlint
        run: pixi run actionlint

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
      - name: Unit + integration tests
        run: pixi run test

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
      - name: cargo llvm-cov (>= 90% lines)
        run: pixi run cov

  # What we carry ourselves. A tool that reports other people's vulnerable dependencies has no
  # business not checking its own, and a per-pull-request run cannot see an advisory published
  # after a merge — supply-chain.yml runs the same check weekly for that.
  deny:
    name: Dependency advisories and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: lint
          cache: true
      - name: cargo deny
        run: pixi run -e lint deny

  # The MSRV is a promise, and an untested promise is a wrong one waiting to happen: every
  # other job builds on whatever rustc the default environment pins, which is far newer.
  msrv:
    name: Builds on the MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: msrv
          cache: true
      - name: cargo check on the oldest supported toolchain
        run: pixi run -e msrv msrv-check

  # The benchmarks are run for one iteration each, not timed: a shared runner's numbers say
  # more about the runner than about the code, but a benchmark that no longer compiles or
  # panics on its inputs is a real break and this catches it.
  bench:
    name: Benchmarks compile and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
      - name: cargo bench --test
        run: pixi run bench-test
      # Which release `@v0`, `@v0.12.0` or a branch installs; a wrong answer ships every user the wrong binary.
      - name: The action's version resolution
        run: pixi run action-test
      # The performance gate decides whether a build fails, so what it does with a given pair
      # of numbers is checked here rather than discovered on a red run.
      - name: The performance gate's own tests
        run: pixi run perf-test
      # A release refuses to tag without What's new notes and moves them into the release commit;
      # a mistake here either blocks every release or ships one with the wrong heading.
      - name: The What's new release step's own tests
        run: pixi run whats-new-test
      - name: The Grype comparison's own tests
        run: pixi run grype-compare-test
      - name: The CPE table upkeep's own tests
        run: pixi run cpe-upkeep-test

  # Tab completion as people get it: pixi-sbom's registration and the documented `pixi sbom`
  # snippets loaded into real fish, bash, zsh and PowerShell, each asked what Tab offers. Windows
  # runs the shells Windows users have: PowerShell 7 and the Windows PowerShell 5.1 it ships.
  completion:
    name: Shell completion (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
      # conda-forge's zsh is built without zsh/zpty, which driving its completion needs.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Completion in real shells
        run: pixi run completion-e2e

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
      - name: Release build
        run: pixi run build
      - name: Smoke test
        run: pixi run cargo run --release -- --version

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: docs
          cache: true
      - name: Build the site strictly
        run: pixi run -e docs docs-build

  # Dogfood the GitHub Action: generate this repository's own SBOMs with the released binary.
  sbom:
    name: SBOM via action (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
      id-token: write # attestations
      attestations: write
    strategy:
      fail-fast: false
      # All five release platforms, not the three `-latest` labels the other jobs use, because
      # what this job exercises is the action's own `RUNNER_OS-RUNNER_ARCH` mapping to a release
      # archive (action.yml). Two of those five branches used to never run, so a wrong platform
      # string or archive extension in them would have been found by a user rather than here
      # (#225). The job downloads a prebuilt binary rather than compiling, so five legs cost
      # well under a minute each.
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
          - { os: macos-15-intel, target: osx-64 }
          - { os: macos-latest, target: osx-arm64 }
          - { os: windows-latest, target: win-64 }
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOMs for every environment
        id: sbom
        uses: ./
        with:
          all-environments: "true"
          fetch-licenses: "true"
          pypi-mapping: prefix
          embedded-sboms: "true"
          # Vulnerabilities from OSV with CISA KEV flags, uploaded as SARIF from the linux-64 leg
          # only (one category per commit is enough, and there are two Linux runners now); the
          # gate reports rather than fails, since this lockfile's dev dependencies are not what
          # the tool ships.
          vulnerabilities: osv
          kev: "true"
          fail-on-severity: critical
          fail-on-kev: "true"
          fail-on-vulnerabilities: "false"
          upload-sarif: ${{ matrix.target == 'linux-64' && 'true' || 'false' }}
          sarif-category: pixi-sbom-${{ matrix.target }}
          # Attest the documents on main (pull requests have no id-token), from linux-64 only.
          attest: ${{ github.event_name == 'push' && matrix.target == 'linux-64' && 'true' || 'false' }}
          # Python-2.0 (pre-commit's python) is in every environment on every platform, so the
          # deny list trips everywhere and, with fail-on-policy off, becomes a warning.
          # require-license holds since 0.5.1 normalizes conda-forge's "WITH exceptions".
          deny-license: "Python-2.0"
          require-license: "true"
          fail-on-policy: "false"
          artifact-name: sboms-${{ matrix.target }}
      - name: Check the documents and the policy outcome
        shell: bash
        run: |
          ls -l sboms/
          test -s sboms/sbom-default.cdx.json
          test "${{ steps.sbom.outputs.policy-violated }}" = "true"
          echo "vulnerability gate tripped: ${{ steps.sbom.outputs.vulnerabilities-found }}"
          echo "pixi-sbom ${{ steps.sbom.outputs.version }} wrote to ${{ steps.sbom.outputs.output }}"
          # Every document carries the lookup's outcome even when it found nothing.
          test -s sboms/sbom-default.cdx.json
      - name: Verify the attestation
        if: ${{ github.event_name == 'push' && matrix.target == 'linux-64' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "attested: ${{ steps.sbom.outputs.attestation-url }}"
          gh attestation verify sboms/sbom-default.cdx.json --repo "$GITHUB_REPOSITORY"
      - name: A satisfied policy exits 0
        uses: ./
        with:
          environment: default
          platform: linux-64
          output: sboms-policy
          deny-license: "AGPL-3.0-only"
          require-license: "true"
          upload-artifact: "false"

  # The action on a uv project and a venv, on a runner with no pixi: what a uv user's workflow
  # looks like. Until a release reads uv.lock, the action cannot download a binary that does,
  # so this builds the head binary here and puts it where the action keeps an install it has
  # already made (the reuse path it takes when it runs twice in one job), under a version no
  # release has. Everything after the download is the action exactly as a user runs it.
  action-head-binary:
    name: Build the binary for the action tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
      - run: pixi run build
      - uses: actions/upload-artifact@v4
        with:
          name: action-head-binary
          path: target/release/pixi-sbom

  action-uv:
    name: Action on a uv project, without pixi
    needs: action-head-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No pixi on this runner
        run: "! command -v pixi"
      - name: Install the head binary where the action reuses an install
        uses: actions/download-artifact@v4
        with:
          name: action-head-binary
          path: ${{ runner.temp }}/pixi-sbom-install/pixi-sbom-v0.0.0-head-linux-64/bin
      - run: chmod +x "$RUNNER_TEMP/pixi-sbom-install/pixi-sbom-v0.0.0-head-linux-64/bin/pixi-sbom"

      - name: SBOM of a uv.lock
        id: uv
        uses: ./
        with:
          version: 0.0.0-head
          lockfile: examples/projects/uv/01-django/uv.lock
          platform: linux-64
          output: sbom-uv
          upload-artifact: "false"
      - name: The document describes the uv project
        env:
          DOCUMENT: ${{ steps.uv.outputs.document }}
        run: |
          set -euo pipefail
          test "$DOCUMENT" = sbom-uv/sbom.cdx.json
          jq -e '.metadata.properties[] | select(.name == "pixi:lockfile") | .value == "uv.lock"' "$DOCUMENT"
          jq -e '[.components[] | select(.name == "django")] | length == 1' "$DOCUMENT"
          jq -e '.components | length >= 20' "$DOCUMENT"

      - name: A venv built in this job
        run: |
          python3 -m venv venv
          venv/bin/pip install --quiet requests==2.32.3
      - name: SBOM of the venv
        id: venv
        uses: ./
        with:
          version: 0.0.0-head
          prefix: venv
          output: sbom-venv
          upload-artifact: "false"
      - name: The document describes the venv
        env:
          DOCUMENT: ${{ steps.venv.outputs.document }}
        run: |
          set -euo pipefail
          jq -e '.metadata.properties[] | select(.name == "pixi:prefix") | .value == "venv"' "$DOCUMENT"
          jq -e '[.components[] | select(.name == "requests" and .version == "2.32.3")] | length == 1' "$DOCUMENT"
          # pip marks what was asked for by name (REQUESTED), and the root depends on that, not on
          # urllib3 and the rest that came along. ensurepip may mark pip itself as well.
          jq -e '[.dependencies[] | select(.ref == "root") | .dependsOn[]] | index("pkg:pypi/requests@2.32.3") != null' "$DOCUMENT"
          jq -e '[.dependencies[] | select(.ref == "root") | .dependsOn[]] | all(startswith("pkg:pypi/urllib3@") | not)' "$DOCUMENT"

      - name: Two sources at once are refused
        id: both
        continue-on-error: true
        uses: ./
        with:
          version: 0.0.0-head
          lockfile: examples/projects/uv/01-django/uv.lock
          prefix: venv
          upload-artifact: "false"
      - name: It failed, as it should
        if: steps.both.outcome != 'failure'
        run: |
          echo "::error::lockfile and prefix together should have failed"
          exit 1
