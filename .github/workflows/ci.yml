name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
      - name: pre-commit
        run: pixi run pre-commit-run
      - name: cargo fmt / clippy / check
        run: |
          pixi run cargo fmt --check
          pixi run lint
          pixi run check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
      - name: Unit + integration tests
        run: pixi run test

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
      - name: cargo llvm-cov (>= 90% lines)
        run: pixi run cov

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
      - name: Release build
        run: pixi run build
      - name: Smoke test
        run: pixi run cargo run --release -- --version

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: docs
          cache: true
      - name: Build the site strictly
        run: pixi run -e docs docs-build

  # Dogfood the GitHub Action: generate this repository's own SBOMs with the released binary.
  sbom:
    name: SBOM via action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      security-events: write # SARIF upload to code scanning
      id-token: write # attestations
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOMs for every environment
        id: sbom
        uses: ./
        with:
          all-environments: "true"
          fetch-licenses: "true"
          pypi-mapping: prefix
          embedded-sboms: "true"
          # Vulnerabilities from OSV with CISA KEV flags, uploaded as SARIF from the Linux runner
          # (one category per commit is enough); the gate reports rather than fails, since this
          # lockfile's dev dependencies are not what the tool ships.
          vulnerabilities: osv
          kev: "true"
          fail-on-severity: critical
          fail-on-kev: "true"
          fail-on-vulnerabilities: "false"
          upload-sarif: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
          sarif-category: pixi-sbom-${{ matrix.os }}
          # Attest the documents on main (pull requests have no id-token), from Linux only.
          attest: ${{ github.event_name == 'push' && matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
          # Python-2.0 (pre-commit's python) is in every environment on every platform, so the
          # deny list trips everywhere and, with fail-on-policy off, becomes a warning.
          # require-license holds since 0.5.1 normalizes conda-forge's "WITH exceptions".
          deny-license: "Python-2.0"
          require-license: "true"
          fail-on-policy: "false"
          artifact-name: sboms-${{ matrix.os }}
      - name: Check the documents and the policy outcome
        shell: bash
        run: |
          ls -l sboms/
          test -s sboms/sbom-default.cdx.json
          test "${{ steps.sbom.outputs.policy-violated }}" = "true"
          echo "vulnerability gate tripped: ${{ steps.sbom.outputs.vulnerabilities-found }}"
          echo "pixi-sbom ${{ steps.sbom.outputs.version }} wrote to ${{ steps.sbom.outputs.output }}"
          # Every document carries the lookup's outcome even when it found nothing.
          test -s sboms/sbom-default.cdx.json
      - name: Verify the attestation
        if: ${{ github.event_name == 'push' && matrix.os == 'ubuntu-latest' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "attested: ${{ steps.sbom.outputs.attestation-url }}"
          gh attestation verify sboms/sbom-default.cdx.json --repo "$GITHUB_REPOSITORY"
      - name: A satisfied policy exits 0
        uses: ./
        with:
          environment: default
          platform: linux-64
          output: sboms-policy
          deny-license: "AGPL-3.0-only"
          require-license: "true"
          upload-artifact: "false"
