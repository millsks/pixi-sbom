name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
      - name: pre-commit
        run: pixi run pre-commit-run
      - name: cargo fmt / clippy / check
        run: |
          pixi run cargo fmt --check
          pixi run lint
          pixi run check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
      - name: Unit + integration tests
        run: pixi run test

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
      - name: cargo llvm-cov (>= 90% lines)
        run: pixi run cov

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: default
          cache: true
      - name: Release build
        run: pixi run build
      - name: Smoke test
        run: pixi run cargo run --release -- --version

  # Dogfood the GitHub Action: generate this repository's own SBOMs with the released binary.
  sbom:
    name: SBOM via action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOMs for every environment
        id: sbom
        uses: ./
        with:
          all-environments: "true"
          fetch-licenses: "true"
          pypi-mapping: prefix
          embedded-sboms: "true"
          # Python-2.0 (pre-commit's python) is in every environment on every platform, so the
          # deny list trips everywhere and, with fail-on-policy off, becomes a warning.
          # (require-license would rightly fail on Linux: kernel-headers and sysroot declare
          # "... WITH exceptions", which is not an SPDX expression.)
          deny-license: "Python-2.0"
          fail-on-policy: "false"
          artifact-name: sboms-${{ matrix.os }}
      - name: Check the documents and the policy outcome
        shell: bash
        run: |
          ls -l sboms/
          test -s sboms/sbom-default.cdx.json
          test "${{ steps.sbom.outputs.policy-violated }}" = "true"
          echo "pixi-sbom ${{ steps.sbom.outputs.version }} wrote to ${{ steps.sbom.outputs.output }}"
      - name: A satisfied policy exits 0
        uses: ./
        with:
          environment: default
          platform: linux-64
          output: sboms-policy
          deny-license: "AGPL-3.0-only"
          upload-artifact: "false"
