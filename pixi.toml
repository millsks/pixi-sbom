[workspace]
authors = ["Kevin Mills <millsks@gmail.com>"]
channels = ["conda-forge"]
name = "pixi-sbom"
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]
version = "0.10.1"
exclude-newer = "7d"

[dependencies]
rust = "==1.98.1"

[target.linux.dependencies]
compilers = ">=1.7.0"

[tasks]
fmt = "cargo fmt"
lint = "cargo clippy --all-targets -- -D warnings"
check = "cargo check --all-targets"
test = "cargo test"
test-integration = "cargo test --test '*'"
build = "cargo build --release"
changelog = "git-cliff --config cliff.toml -o CHANGELOG.md"
# The full criterion run, which takes a few minutes; `bench-test` only checks that every
# benchmark still runs, which is what CI needs and what the change harness can afford.
# What the binary costs to run, measured the same way on every platform a release is built
# for. `--compare` diffs two of its JSON outputs and is what the Performance workflow gates on.
perf = "python scripts/perf.py"
perf-test = { cmd = "python -m unittest discover -s scripts -p 'test_*.py' -v", description = "the perf comparison's own tests" }
bench = "cargo bench --benches"
bench-test = "cargo bench --benches -- --test"

# The oldest toolchain the crate claims to build on. Its own environment, because it pins a
# different rust than the one everything else uses; `pixi run -e msrv msrv-check` is what
# proves the number in Cargo.toml rather than trusting it.
[feature.msrv.dependencies]
rust = "==1.88.0"

[feature.msrv.tasks]
msrv-check = "cargo check --all-targets --locked"

[feature.lint.dependencies]
cargo-deny = "*"
pre-commit = "*"
pre-commit-hooks = "*"
taplo = "*"
typos = "*"
git-cliff = "*"

[feature.lint.tasks]
bootstrap = "pre-commit install --hook-type pre-commit --hook-type commit-msg"
# Advisories, licenses, banned crates and sources, against deny.toml. No --all-features: the
# graph deny.toml resolves is meant to be the one we ship.
deny = "cargo deny check"
pre-commit-run = "pre-commit run --all-files"

[feature.cov.dependencies]
cargo-llvm-cov = "*"
cargo-insta = "*"

[feature.cov.tasks]
cov = "cargo llvm-cov --all-targets --fail-under-lines 90"

[feature.dev.tasks]
ci = { depends-on = ["pre-commit-run", "build", "check", "lint", "cov"] }

[feature.docs.dependencies]
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.6"
pymdown-extensions = ">=10"
mike = ">=2.1"

[feature.docs.tasks]
docs-serve = "mkdocs serve"
docs-build = "mkdocs build --strict"

[environments]
default = ["lint", "cov", "dev"]
lint = { features = ["lint"], no-default-feature = true }
docs = { features = ["docs"], no-default-feature = true }
msrv = { features = ["msrv"], no-default-feature = true }
