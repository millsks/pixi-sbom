[workspace]
authors = ["Kevin Mills <millsks@gmail.com>"]
channels = ["conda-forge"]
name = "pixi-sbom"
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]
version = "1.9.0"
exclude-newer = "7d"

[dependencies]
rust = "==1.98.1"

[target.linux.dependencies]
compilers = ">=1.7.0"

[tasks]
fmt = "cargo fmt"
lint = "cargo clippy --all-targets -- -D warnings"
check = "cargo check --all-targets"
test = "cargo test"
test-integration = "cargo test --test '*'"
build = "cargo build --release"
changelog = "git-cliff --config cliff.toml -o CHANGELOG.md"
# The full criterion run, which takes a few minutes; `bench-test` only checks that every
# benchmark still runs, which is what CI needs and what the change harness can afford.
# What the binary costs to run, measured the same way on every platform a release is built
# for. `--compare` diffs two of its JSON outputs and is what the Performance workflow gates on.
perf = "python scripts/perf.py"
perf-test = { cmd = "python -m unittest discover -s scripts -p 'test_perf.py' -v", description = "the perf comparison's own tests" }
lab-cache = { cmd = "python scripts/lab_cache.py", description = "re-record the training lab's online answers into examples/lab-cache" }
lab-cache-test = { cmd = "python -m unittest discover -s scripts -p 'test_lab_cache.py' -v", description = "the lab-cache recorder's own tests" }
completion-e2e = { cmd = "cargo build && python scripts/completion_e2e.py", description = "tab completion in real shells (fish, bash, zsh and PowerShell; PowerShell 7 and 5.1 on Windows), for pixi-sbom and for `pixi sbom` through docs/completion" }
grype-compare = { cmd = "cargo build && python scripts/grype_compare.py", description = "Grype's findings from pixi-sbom's SBOM against syft's, on installed corpus environments (#434); needs the network" }
grype-compare-test = { cmd = "python -m unittest discover -s scripts -p 'test_grype_compare.py' -v", description = "the Grype comparison's own tests" }
whats-new = { cmd = "python scripts/whats_new.py", description = "check, or release, the What's new page's Unreleased section: whats-new check|release <version>" }
whats-new-test = { cmd = "python -m unittest discover -s scripts -p 'test_whats_new.py' -v", description = "the What's new release step's own tests" }
action-test = { cmd = "python -m unittest discover -s scripts -p 'test_action_version.py' -v", description = "which binary the GitHub Action installs for a given ref" }
bench = "cargo bench --benches"
bench-test = "cargo bench --benches -- --test"

# The oldest toolchain the crate claims to build on. Its own environment, because it pins a
# different rust than the one everything else uses; `pixi run -e msrv msrv-check` is what
# proves the number in Cargo.toml rather than trusting it.
[feature.msrv.dependencies]
rust = "==1.88.0"

[feature.msrv.tasks]
msrv-check = "cargo check --all-targets --locked"

[feature.lint.dependencies]
cargo-deny = "*"
pre-commit = "*"
pre-commit-hooks = "*"
taplo = "*"
typos = "*"
git-cliff = "*"
actionlint = ">=1.7.12,<2"

[feature.lint.tasks]
bootstrap = "pre-commit install --hook-type pre-commit --hook-type commit-msg"
# Advisories, licenses, banned crates and sources, against deny.toml. No --all-features: the
# graph deny.toml resolves is meant to be the one we ship.
deny = "cargo deny check"
# The release path cannot be exercised by a pull request, so the expressions, `needs:` graph and
# action inputs in it are checked statically instead of on the day.
actionlint = "actionlint"
# The README recording. Needs `pixi global install vhs` once; deliberately not a project
# dependency, since vhs pulls ttyd and ffmpeg (95 packages, and it doubled pixi.lock) for
# something that runs by hand and never in CI.
demo = { cmd = "bash scripts/record-demo.sh", description = "re-record the demo GIFs; pass a name to do just one" }
pre-commit-run = "pre-commit run --all-files"

[feature.cov.dependencies]
cargo-llvm-cov = "*"
cargo-insta = "*"

[feature.cov.tasks]
cov = "cargo llvm-cov --all-targets --fail-under-lines 90"

[feature.dev.tasks]
ci = { depends-on = ["pre-commit-run", "build", "check", "lint", "cov"] }

# The site toolchain comes from PyPI rather than conda-forge, which is the one place this
# project departs from conda-forge-first. conda-forge's only mkdocs 1.6.1 build declares
# `click >=7.0,<8.3.0a0`, which held the lockfile on click 8.2.1 — PYSEC-2026-2132, a high
# command injection in `click.edit()` that this project's own SBOM job reported against itself
# (#211). mkdocs' real metadata asks for `click>=7.0`; the cap is the packaging, not the code.
# Revisit when conda-forge ships an mkdocs build without it.
[feature.docs.dependencies]
python = "3.14.*"
# Conda-side, so the PyPI solve sees it as already satisfied and cannot pull a capped one. The
# floor is the fixed release: a future dependency that caps click again fails the solve here
# instead of quietly reintroducing the advisory.
click = ">=8.3.3"

[feature.docs.pypi-dependencies]
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.6"
pymdown-extensions = ">=10"
mike = ">=2.1"

[feature.docs.tasks]
docs-serve = "mkdocs serve"
docs-build = "mkdocs build --strict"

# The tools that write examples/projects (#362). Dev-only: pixi-sbom never resolves, these do, and
# `pixi run examples` regenerates every example lockfile from its manifest. Each example declares its
# own Python floor (3.14 by default, older where a scenario shows old, vulnerable pins); uv, Poetry,
# PDM and conda-lock lock for what a manifest declares whatever they run on. They run on 3.13
# because dulwich (Poetry, conda-lock) has no 3.14 build yet.
[feature.examples.dependencies]
python = "3.13.*"
uv = "*"
poetry = ">=2"
pdm = "*"
# findpython 0.7.0 and 0.7.1 on conda-forge ship a link.json whose entry point is quoted twice
# ("\"findpython.__main__"), which pixi refuses to link; pdm needs >=0.7, and 0.8 is packaged cleanly.
findpython = ">=0.8"
conda-lock = "*"
# conda-lock's solver. Without it, conda-lock downloads a standalone conda and one scenario took 26
# minutes; with it, seconds. Below 2: conda-lock clears host virtual packages by setting
# CONDA_OVERRIDE_OSX="" and micromamba 2 reads that as macOS version "", so every osx-arm64 Python
# 3.13+ (which needs __osx >=11.0) becomes unsolvable.
micromamba = "<2"
pipenv = ">=2026.8.0,<2027"
pip-tools = ">=7.6.1,<8"

# `pip lock` locks for the interpreter running it, so the pylock examples it writes use 3.14.
[feature.examples-pip.dependencies]
python = "3.14.*"
pip = ">=25.1"

[feature.examples.tasks]
examples = { cmd = "python scripts/examples.py", description = "regenerate every example lockfile under examples/projects with the real tools" }
examples-test = { cmd = "python -m unittest discover -s scripts -p 'test_examples.py' -v", description = "the example generator's own tests" }

[environments]
default = ["lint", "cov", "dev"]
lint = { features = ["lint"], no-default-feature = true }
docs = { features = ["docs"], no-default-feature = true }
msrv = { features = ["msrv"], no-default-feature = true }
examples = { features = ["examples"], no-default-feature = true }
examples-pip = { features = ["examples-pip"], no-default-feature = true }
