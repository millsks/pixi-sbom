repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The exported decks are generated files: whatever the exporter wrote is what should be
      # in git, or the copy here stops being the copy that was exported.
      - id: end-of-file-fixer
        exclude: ^docs/presentations/.*\.(html|pdf|pptx)$
      - id: trailing-whitespace
        exclude: ^docs/presentations/.*\.(html|pdf|pptx)$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: pixi run cargo fmt --
        language: system
        types: [rust]
        pass_filenames: false
      - id: clippy
        name: clippy
        entry: pixi run cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      - id: taplo
        name: taplo
        entry: pixi run taplo format
        language: system
        types: [toml]
      - id: typos
        name: typos
        entry: pixi run typos
        language: system
        pass_filenames: false
