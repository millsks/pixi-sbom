site_name: pixi-sbom
site_description: CycloneDX and SPDX Software Bills of Materials from pixi.lock
site_url: https://millsks.github.io/pixi-sbom/
repo_url: https://github.com/millsks/pixi-sbom
repo_name: millsks/pixi-sbom
edit_uri: edit/main/docs/
copyright: MIT licensed

docs_dir: docs
# The theme override lives under docs/ for the strict build's sake; it is not a page.
exclude_docs: |
  overrides/
strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Overview: index.md
  - Installation: installation.md
  - Command-line reference: cli.md
  - GitHub Action: github-action.md
  - CI recipes: ci-recipes.md
  - Which format to pick: formats.md
  - Output format reference: output-format.md
  - Troubleshooting: troubleshooting.md
  - Contributing:
      - Architecture: architecture.md
      - Development: development.md
  - Changelog: changelog.md

hooks:
  - mkdocs_hooks.py

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  # Light by default regardless of the OS preference; the toggle switches to dark.
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  # Aliases (`latest`) are real copies so GitHub Pages serves them without symlinks or redirects,
  # and every version's pages declare the `latest` URL as canonical for search engines.
  - mike:
      alias_type: copy
      canonical_version: latest

extra:
  # Version selector fed by mike's versions.json; the site root redirects to `latest`.
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/millsks/pixi-sbom
