site_name: pixi-sbom
site_description: CycloneDX and SPDX Software Bills of Materials from pixi.lock
site_url: https://millsks.github.io/pixi-sbom/
repo_url: https://github.com/millsks/pixi-sbom
repo_name: millsks/pixi-sbom
edit_uri: edit/main/docs/
copyright: Apache-2.0 licensed

docs_dir: docs
# These live under docs/ for the strict build's sake; none of them is a page.
exclude_docs: |
  overrides/
  papers/
  posts/
  presentations/
  release-notes/
strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Overview: index.md
  - Installation: installation.md
  - What's new: whats-new.md
  - Without pixi: without-pixi.md
  - Try it on the examples: try-the-examples.md
  - Training lab: lab.md
  - Field manual:
      - Overview: field-manual/index.md
      - Gate a repository in CI: field-manual/ci-gate.md
      - Take in a vendor's SBOM: field-manual/vendor-sbom.md
      - One SBOM for a product: field-manual/product-sbom.md
      - Are we exposed?: field-manual/are-we-exposed.md
      - A restricted network: field-manual/restricted-network.md
      - A project without pixi: field-manual/without-pixi.md
      - Release with a signed SBOM: field-manual/signed-release.md
  - Command-line reference: cli.md
  - GitHub Action: github-action.md
  - CI recipes: ci-recipes.md
  - Which format to pick: formats.md
  - Output format reference: output-format.md
  - What 1.0 freezes: stability.md
  - Troubleshooting: troubleshooting.md
  - Security policy: security.md
  - Contributing:
      - Architecture: architecture.md
      - Development: development.md
      - Benchmarks: benchmarks.md
  - Changelog: changelog.md

hooks:
  - mkdocs_hooks.py

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  # Light by default regardless of the OS preference; the toggle switches to dark.
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  # Shell snippets live as real files so CI runs exactly what the page shows.
  - pymdownx.snippets:
      base_path: [docs/completion]
      check_paths: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  # Aliases (`latest`) are real copies so GitHub Pages serves them without symlinks or redirects,
  # and every version's pages declare the `latest` URL as canonical for search engines.
  - mike:
      alias_type: copy
      canonical_version: latest

extra:
  # Version selector fed by mike's versions.json; the site root redirects to `latest`.
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/millsks/pixi-sbom

extra_javascript:
  - javascripts/lab-progress.js
