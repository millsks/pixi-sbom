[workspace]
name = "flask-example"
version = "0.1.0"
description = "Flask API with a 2021-era stack"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.11.*"
flask = "2.0.1.*"
werkzeug = "2.0.2.*"
jinja2 = "3.0.1.*"
itsdangerous = "2.0.1.*"
flask-cors = "3.0.10.*"
flask-sqlalchemy = "2.5.1.*"
sqlalchemy = "1.4.46.*"
requests = "2.25.1.*"
urllib3 = "1.26.4.*"

[feature.test.pypi-dependencies]
pytest = "==7.0.0"
pytest-flask = "==1.2.0"

[environments]
test = ["test"]
