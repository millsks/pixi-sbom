[workspace]
name = "dev-tooling-example"
version = "0.1.0"
description = "A library whose dependencies are almost all dev groups"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
attrs = ">=23"
ruff = "*"
mypy = "*"
pylint = "*"
black = "24.1.0.*"
pytest = "*"
pytest-cov = "*"
hypothesis = "*"

[feature.lint.pypi-dependencies]
ruff = ">=0.6"
mypy = ">=1.11"
pylint = ">=3.2"
black = "==24.1.0"

[feature.test.pypi-dependencies]
pytest = ">=8"
pytest-cov = ">=5"
hypothesis = ">=6.100"

[feature.docs.pypi-dependencies]
mkdocs-material = ">=9.5"

[feature.release.pypi-dependencies]
build = ">=1.2"
twine = ">=5"

[environments]
lint = ["lint"]
test = ["test"]
docs = ["docs"]
release = ["release"]
