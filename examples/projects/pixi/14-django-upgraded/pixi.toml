[workspace]
name = "django-upgraded-example"
version = "0.1.0"
description = "01-django after the upgrade: Django 4.2 LTS and fixed pins"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.14.*"
django = ">=4.2.24,<5"
djangorestframework = ">=3.15.2"
sqlparse = ">=0.5"
psycopg = ">=3.2"
gunicorn = ">=23"
pillow = ">=11"

[pypi-dependencies]
django-environ = ">=0.11"
internal-utils = { path = "libs/internal-utils", editable = true }

[feature.s3.pypi-dependencies]
django-storages = { version = ">=1.14", extras = ["s3"] }

[feature.dev.pypi-dependencies]
django-debug-toolbar = ">=4.4"

[feature.test.pypi-dependencies]
pytest-django = ">=4.9"
factory-boy = ">=3.3"

[environments]
s3 = ["s3"]
dev = ["dev"]
test = ["test"]
