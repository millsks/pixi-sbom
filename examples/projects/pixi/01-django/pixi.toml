[workspace]
name = "django-example"
version = "0.1.0"
description = "Django web application on an old LTS"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.11.*"
django = "3.2.12.*"
djangorestframework = "3.12.4.*"
sqlparse = "0.4.2.*"
psycopg2 = "2.9.6.*"
gunicorn = "20.1.0.*"
pillow = "9.4.0.*"

[pypi-dependencies]
django-environ = "==0.9.0"
internal-utils = { path = "libs/internal-utils", editable = true }

[feature.s3.pypi-dependencies]
django-storages = { version = "==1.13.2", extras = ["s3"] }

[feature.dev.pypi-dependencies]
django-debug-toolbar = { git = "https://github.com/django-commons/django-debug-toolbar", rev = "3.2.4" }

[feature.test.pypi-dependencies]
pytest-django = "==4.5.2"
factory-boy = "==3.2.1"

[environments]
s3 = ["s3"]
dev = ["dev"]
test = ["test"]
