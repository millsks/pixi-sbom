[workspace]
name = "cli-tool-example"
version = "0.1.0"
description = "A small, current command-line tool"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.14.*"
click = ">=8.1"
rich = ">=13.7"
typer = ">=0.12"
httpx = ">=0.27"
platformdirs = ">=4"

[feature.test.pypi-dependencies]
pytest = ">=8"

[environments]
test = ["test"]
