[workspace]
name = "fastapi-example"
version = "0.1.0"
description = "FastAPI service on Python 3.14"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.12.*"
fastapi = "0.114.1.*"
starlette = "0.38.6.*"
uvicorn = "0.30.6.*"
python-multipart = "0.0.9.*"
python-jose = "3.3.0.*"
httpx = "0.27.0.*"
pydantic-settings = "*"

[feature.test.pypi-dependencies]
pytest = ">=8"
pytest-asyncio = ">=0.23"

[environments]
test = ["test"]
