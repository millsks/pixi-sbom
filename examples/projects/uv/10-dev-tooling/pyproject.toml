[project]
name = "dev-tooling-example"
version = "0.1.0"
description = "A library whose dependencies are almost all dev groups"
requires-python = ">=3.14"
dependencies = [
    "attrs>=23",
]

[dependency-groups]
lint = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pylint>=3.2",
    "black==24.1.0",
]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
]
docs = [
    "mkdocs-material>=9.5",
]
release = [
    "build>=1.2",
    "twine>=5",
]
