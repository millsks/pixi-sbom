[project]
name = "cli-tool-example"
version = "0.1.0"
description = "A small, current command-line tool"
requires-python = ">=3.14,<4"
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "typer>=0.12",
    "httpx>=0.27",
    "platformdirs>=4",
]

[tool.poetry.group.test.dependencies]
pytest = ">=8"

[tool.poetry]
package-mode = false
