[project]
name = "genai-llm-example"
version = "0.1.0"
description = "An LLM application with LangChain and transformers"
requires-python = ">=3.14,<4"
dependencies = [
    "langchain==0.3.0",
    "langchain-community==0.3.0",
    "openai==1.30.0",
    "tiktoken>=0.8",
    "transformers==4.46.0",
]

[tool.poetry]
package-mode = false
