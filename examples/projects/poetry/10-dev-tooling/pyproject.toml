[project]
name = "dev-tooling-example"
version = "0.1.0"
description = "A library whose dependencies are almost all dev groups"
requires-python = ">=3.14,<4"
dependencies = [
    "attrs>=23",
]

[tool.poetry.group.lint.dependencies]
ruff = ">=0.6"
mypy = ">=1.11"
pylint = ">=3.2"
black = "==24.1.0"

[tool.poetry.group.test.dependencies]
pytest = ">=8"
pytest-cov = ">=5"
hypothesis = ">=6.100"

[tool.poetry.group.docs.dependencies]
mkdocs-material = ">=9.5"

[tool.poetry.group.release.dependencies]
build = ">=1.2"
twine = ">=5"

[tool.poetry]
package-mode = false
