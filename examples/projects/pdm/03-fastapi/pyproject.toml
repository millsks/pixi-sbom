[project]
name = "fastapi-example"
version = "0.1.0"
description = "FastAPI service on Python 3.14"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.114.0",
    "starlette==0.38.6",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "python-jose[cryptography]==3.3.0",
    "httpx==0.27.0",
    "pydantic-settings>=2.4",
]

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
