[project]
name = "aws-cloud-example"
version = "0.1.0"
description = "AWS automation with boto3 and SSH"
requires-python = ">=3.14"
dependencies = [
    "boto3==1.40.50",
    "paramiko==3.3.1",
    "PyJWT==2.3.0",
    "requests==2.31.0",
    "urllib3==2.0.6",
]

[project.optional-dependencies]
cli = [
    "awscli>=1.36",
]
