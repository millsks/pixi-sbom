[project]
name = "django-example"
version = "0.1.0"
description = "Django web application on an old LTS"
requires-python = ">=3.11,<3.12"
dependencies = [
    "Django[argon2]==3.2.12",
    "djangorestframework==3.12.4",
    "sqlparse==0.4.2",
    "psycopg2-binary==2.9.5",
    "gunicorn==20.1.0",
    "Pillow==9.3.0",
    "django-environ==0.9.0",
    "internal-utils @ file:///${PROJECT_ROOT}/libs/internal-utils",
]

[project.optional-dependencies]
s3 = [
    "django-storages[s3]==1.13.2",
]

[dependency-groups]
dev = [
    "django-debug-toolbar @ git+https://github.com/django-commons/django-debug-toolbar@3.2.4",
]
test = [
    "pytest-django==4.5.2",
    "factory-boy==3.2.1",
]
