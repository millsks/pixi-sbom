[project]
name = "flask-example"
version = "0.1.0"
description = "Flask API with a 2021-era stack"
requires-python = ">=3.11,<3.12"
dependencies = [
    "Flask[async]==2.0.1",
    "Werkzeug==2.0.2",
    "Jinja2==3.0.1",
    "itsdangerous==2.0.1",
    "Flask-Cors==3.0.10",
    "Flask-SQLAlchemy==2.5.1",
    "SQLAlchemy==1.4.46",
    "requests==2.25.1",
    "urllib3==1.26.4",
]

[dependency-groups]
test = [
    "pytest==7.0.0",
    "pytest-flask==1.2.0",
]
