  "transformers==4.46.0",
  "accelerate>=1.0",
  "datasets>=3.0",
  "safetensors>=0.4",
]
conda = ["pytorch=2.9.1", "torchvision", "transformers=4.46.0", "accelerate", "datasets", "safetensors"]

