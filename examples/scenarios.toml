# The scenarios behind examples/projects (#362). `pixi run examples` turns each one into a small
# project for every reader and locks it with that reader's own tool.
#
#   python        requires-python for the Python readers; >=3.14 unless the scenario shows old pins
#   conda_python  python= for the conda readers; 3.14 unless the scenario shows old pins
#   dependencies  PEP 508 requirements for the Python readers (pylock, uv, poetry, pdm)
#   optional      the project's own extras ([project.optional-dependencies])
#   groups        dependency groups (PEP 735 for uv/pdm, [tool.poetry.group] for Poetry)
#   local         also depend on examples/shared/internal-utils by path (Python readers only)
#   pdm_python    a narrower Python range for `pdm lock --python`, where PDM will not lock around an exclusion
#   poetry_python requires-python for the Poetry manifest only, where a dependency caps the range
#   pylock_tool   "pip" to write pylock.toml with `pip lock` instead of `uv export`
#   requirements_tool "pip-compile" to write requirements.txt with pip-compile instead of `uv pip compile`
#   conda         conda-forge specs for the conda readers
#   conda_pip     a pip section for conda-lock.yml (explicit specs cannot carry one)
#   pixi_conda    extra conda specs for the pixi workspace only, where a conda pick would conflict with a
#                 PyPI dependency pixi installs on top of it (pixi never lets PyPI replace a conda package)
#   shows         what the scenario is there to demonstrate, for the README

[[scenario]]
id = "01-django"
title = "Django web application on an old LTS"
python = ">=3.11,<3.12"
conda_python = "3.11"
shows = ["vulnerabilities", "outdated", "licenses", "local path", "VCS", "extras", "groups"]
dependencies = [
  "Django[argon2]==3.2.12",
  "djangorestframework==3.12.4",
  "sqlparse==0.4.2",
  "psycopg2-binary==2.9.5",
  "gunicorn==20.1.0",
  "Pillow==9.3.0",
  "django-environ==0.9.0",
]
optional = { s3 = ["django-storages[s3]==1.13.2"] }
groups = { dev = [
  "django-debug-toolbar @ git+https://github.com/django-commons/django-debug-toolbar@3.2.4",
], test = [
  "pytest-django==4.5.2",
  "factory-boy==3.2.1",
] }
local = true
conda = [
  "django=3.2.12",
  "djangorestframework=3.12.4",
  "sqlparse=0.4.2",
  "psycopg2=2.9.6",
  "gunicorn=20.1.0",
  "pillow=9.4.0",
]
conda_pip = ["django-environ==0.9.0"]

