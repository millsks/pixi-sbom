# CPEs for native conda packages: conda package name = "vendor:product", spelled as NVD's CPE
# dictionary and Grype's database spell them. A package missing here gets no CPE: pixi-sbom never
# guesses one from a name, which is where scanners' false positives on conda packages come from.
#
# The version in a CPE is the conda package's own version. Leave out a package whose conda version
# is spelled differently from upstream's (imagemagick's 7.1.1_39), or whose NVD vendor is split
# between products that are not the same code (cyrus-sasl, libjpeg), or that is a compiler runtime
# or C library (gcc, glibc), which matches advisories for code a conda package does not contain.
#
# The format of this file is part of the stability contract; the entries are not, and are corrected
# in patch releases. docs/development.md says how to add or check one.

[cpe]
bzip2 = "bzip:bzip2"
c-ares = "c-ares_project:c-ares"
cairo = "cairographics:cairo"
curl = "haxx:curl"
dav1d = "videolan:dav1d"
expat = "libexpat_project:libexpat"
ffmpeg = "ffmpeg:ffmpeg"
fontconfig = "fontconfig_project:fontconfig"
freetype = "freetype:freetype"
gdal = "osgeo:gdal"
gettext = "gnu:gettext"
giflib = "giflib_project:giflib"
git = "git-scm:git"
glib = "gnome:glib"
gnutls = "gnu:gnutls"
go = "golang:go"
harfbuzz = "harfbuzz_project:harfbuzz"
hdf5 = "hdfgroup:hdf5"
icu = "icu-project:international_components_for_unicode"
jasper = "jasper_project:jasper"
krb5 = "mit:kerberos_5"
lcms2 = "littlecms:little_cms_color_engine"
libarchive = "libarchive:libarchive"
libcurl = "haxx:libcurl"
libevent = "libevent_project:libevent"
libexpat = "libexpat_project:libexpat"
libgcrypt = "gnupg:libgcrypt"
libgdal = "osgeo:gdal"
libgit2 = "libgit2:libgit2"
libglib = "gnome:glib"
libheif = "struktur:libheif"
libidn2 = "gnu:libidn2"
libjpeg-turbo = "libjpeg-turbo:libjpeg-turbo"
liblzma = "tukaani:xz"
libnetcdf = "unidata:netcdf"
libnghttp2 = "nghttp2:nghttp2"
