libsqlite = "sqlite:sqlite"
libssh = "libssh:libssh"
libssh2 = "libssh2:libssh2"
libtiff = "libtiff:libtiff"
libuv = "libuv:libuv"
libvpx = "webmproject:libvpx"
libwebp = "webmproject:libwebp"
