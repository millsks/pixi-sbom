[files]
extend-exclude = [
  # Generated by git-cliff on release; commit hashes look like words to a spell checker.
  "CHANGELOG.md",
  "tests/fixtures/**",
  "tests/schemas/**",
  "**/snapshots/**",
  "Cargo.lock",
  "pixi.lock",
  "*.cdx.json",
  "*.spdx.json",
]

[default.extend-words]
# PyPI package name used in tests
certifi = "certifi"
# Crate name (deflate implementation)
flate = "flate"
